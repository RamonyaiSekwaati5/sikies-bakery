<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Sikie's Homemade Bakery</title>
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .checkout-wrapper { max-width: 900px; margin: 40px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  @media (max-width: 768px) { .checkout-wrapper { grid-template-columns: 1fr; } }
  .order-summary { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 24px; height: fit-content; }
  .order-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--line); font-size: 0.9rem; }
</style>
</head>
<body>

<header class="site-header">
  <nav class="nav container">
    <a href="index.html" class="brand">
      <img src="images/logo.png" alt="Sikie's Homemade Bakery logo">
      <span class="brand-text"><strong>Sikie's</strong><span>Homemade Bakery</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span></button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-cta">
      <a href="menu.html" class="btn btn-primary btn-sm">Order now</a>
    </div>
  </nav>
</header>

<main>
  <div class="container">
    <div class="checkout-wrapper">
      <div class="form-card">
        <h2>Delivery Details</h2>
        <p style="color:var(--espresso-soft); font-size: 0.9rem;">No account needed. Just tell us where to drop it off.</p>

        <form id="checkout-form">
          <div class="field">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Your name" required>
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 078 123 4567" required>
          </div>
          <div class="field">
            <label for="address">Delivery Address</label>
            <input type="text" id="address" placeholder="Street, Suburb, City" required>
          </div>
          <div class="field">
            <label for="notes">Order Notes (Optional)</label>
            <textarea id="notes" rows="3" placeholder="e.g. Please leave at the gate"></textarea>
          </div>

          <button type="submit" class="btn btn-jam btn-block" style="margin-top: 10px;">Place Order</button>
        </form>
      </div>

      <div class="order-summary">
        <h3>Your Order</h3>
        <div id="summary-items"></div>

        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-top: 16px;">
          <span>Total</span>
          <span id="summary-total">R0.00</span>
        </div>
        <p class="form-hint" style="margin-top: 10px;">Payment is collected on delivery or via EFT.</p>
      </div>
    </div>
  </div>
</main>

<script>
  // ---- Load cart (defensive: handles object-keyed cart, array cart, or missing/empty) ----
  const rawCartString = localStorage.getItem('sikies_cart');
  console.log('[checkout] raw sikies_cart from localStorage:', rawCartString);

  let cart = [];
  if (rawCartString) {
    try {
      const parsed = JSON.parse(rawCartString);
      cart = Array.isArray(parsed) ? parsed : Object.values(parsed);
    } catch (e) {
      console.error('[checkout] Failed to parse sikies_cart:', e);
      cart = [];
    }
  }
  console.log('[checkout] cart after normalization:', cart);

  const itemsContainer = document.getElementById('summary-items');
  const totalContainer = document.getElementById('summary-total');

  function renderSummary() {
    if (cart.length === 0) {
      itemsContainer.innerHTML = '<p style="color:var(--espresso-soft);">Your cart is empty. <a href="menu.html" style="color:var(--toasted); font-weight:700;">Go to menu</a></p>';
      totalContainer.textContent = 'R0.00';
      return 0;
    }

    let total = 0;
    let html = '';
    cart.forEach(item => {
      const price = Number(item.price) || 0;
      const qty = Number(item.qty) || 0;
      total += price * qty;
      html += `<div class="order-line"><span>${item.name} × ${qty}</span><span>R${(price * qty).toFixed(2)}</span></div>`;
    });
    itemsContainer.innerHTML = html;
    totalContainer.textContent = 'R' + total.toFixed(2);
    return total;
  }

  renderSummary();

  document.getElementById('checkout-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    if (cart.length === 0) {
      alert('Your cart is empty. Please add items from the menu before checking out.');
      return;
    }

    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const address = document.getElementById('address').value;

    let total = 0;
    cart.forEach(item => { total += (Number(item.price) || 0) * (Number(item.qty) || 0); });

    // Save the order locally (no database) so it can be viewed later if needed
    const order = { customer_name: name, phone: phone, address: address, notes: document.getElementById('notes').value, items: cart, total: total, status: 'New', date: new Date().toISOString() };
    const pastOrders = JSON.parse(localStorage.getItem('sikies_orders') || '[]');
    pastOrders.push(order);
    localStorage.setItem('sikies_orders', JSON.stringify(pastOrders));

    localStorage.removeItem('sikies_cart');
    document.querySelector('.checkout-wrapper').innerHTML = `
      <div class="card" style="text-align: center; padding: 50px; grid-column: 1 / -1;">
        <h2>Order Placed Successfully! 🎉</h2>
        <p style="color: var(--espresso-soft);">Thank you ${name}! Sikie will call you shortly to confirm your order.</p>
        <a href="menu.html" class="btn btn-primary" style="margin-top: 20px;">Back to Menu</a>
      </div>`;
  });
</script>
</body>
</html>
